name: Verify and build
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - uses: gradle/actions/setup-gradle@v4
      - name: Verify adaptation manifest
        run: python tools/update_adaptation_manifest.py --check
      - name: Test and build
        run: bash gradlew testDebugUnitTest assembleDebug --console=plain
      - uses: actions/upload-artifact@v4
        with:
          name: HGModule-v1.0.0
          path: |
            app/build/outputs/apk/debug/*.apk
            adaptation/gp-*.json
